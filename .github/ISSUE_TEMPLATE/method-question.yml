name: 方法或出处问题 / Method or source issue
description: 规则的出处、古籍引文、解释方法有疑问或错误
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        例子请用公版古籍命例。不要贴真实生日或真实人物的报告。
        Use public-domain classical charts only.
  - type: input
    id: file
    attributes:
      label: 涉及的文件和条目 / File and rule ID
      placeholder: 例如 references/04-格局与用神.md G04-09
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题 / What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 依据 / Source
      description: 书名、篇名、版本或电子本链接。现代著作请概述，不要贴大段原文
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认 / Confirm
      options:
        - label: 上面没有任何真实人物的生日或经历 / No real person's birth data or life events above
          required: true
