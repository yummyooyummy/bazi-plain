name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      # Private acceptance fixtures live outside the repository and are not
      # available here, so those tests are reported as skipped (-rs shows why).
      - name: Run tests
        run: python -m pytest scripts/tests evals/tests -q -rs

      - name: Smoke test with a public-domain chart
        run: python scripts/paipan.py --chart 戊辰 戊午 戊申 己未 > /dev/null

      - name: Check links, skill name and local paths
        run: python tools/check_release.py
